<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>goodgriefgnome</title>
    <style>
      :root { color-scheme: light dark; --fg: #222; --bg: #fafaf7; --muted: #777; --card: #fff; --line: #e4e4de; --accent: #3a6ea5; }
      @media (prefers-color-scheme: dark) {
        :root { --fg: #e8e8e3; --bg: #18181a; --muted: #999; --card: #222225; --line: #333338; --accent: #7aa7d9; }
      }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 system-ui, sans-serif; }
      main { max-width: 36rem; margin: 0 auto; padding: 4rem 1rem; }
      h1 { margin: 0; font-size: 2rem; }
      p { margin: .25rem 0 2.5rem; color: var(--muted); }
      ul { list-style: none; margin: 0; padding: 0; }
      a { display: block; padding: 1rem 1.25rem; background: var(--card); border: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none; }
      a:hover { border-color: var(--accent); }
      a strong { color: var(--accent); }
      a span { display: block; color: var(--muted); font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>goodgriefgnome</h1>
      <p>A few small utilities.</p>
      <ul>
        <li><a href="/metronome.html"><strong>Metronome</strong><span>Adjustable tempo, works offline.</span></a></li>
      </ul>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
